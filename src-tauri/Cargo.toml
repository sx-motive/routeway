[package]
name = "routeway"
version = "0.8.1"
license = "GPL-3.0-or-later"
description = "Split-tunnel router: send chosen domains through your own server, keep the rest direct"
edition = "2021"
rust-version = "1.82"

[lib]
name = "routeway_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "routeway"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
# Keep compatibility with the project's Rust 1.82 minimum.
tauri-plugin-single-instance = "=2.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target."cfg(windows)".dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Networking_WinInet",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]

# Keep unwinding semantics; shrink release artifacts without changing panic handling.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
